[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-crdt-lww-element-set-sync-skill"
version = "1.0.0"
description = "Conflict-free Replicated Data Type (CRDT) Last-Write-Wins element set with Lamport timestamps and deterministic two-way state merge."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
